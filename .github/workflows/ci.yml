name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-sanity:
    name: Repository Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required repo docs exist
        run: |
          test -f AGENTS.md
          test -f GLOSSARY.md
          test -f docs/MISSING_CONTEXT.md

  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/docfill
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice Writer for authoritative PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          libreoffice --headless --version
      - run: pip install -e ".[dev]"
      - name: Verify Alembic migration & seed on PostgreSQL 16
        run: alembic upgrade head && alembic check && python -m app.core.seed
      - name: Smoke test real DOCX to PDF rendering
        run: pytest tests/pa04/test_pdf_rendering.py -q
      - run: ruff check . && mypy . && pytest

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
